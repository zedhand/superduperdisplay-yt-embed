<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>MiniDisplay YouTube embed relay</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      iframe {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border: none;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <script>
      // Static passthrough: takes ?v=<11-char YouTube video id> and embeds
      // it chromeless/autoplay/looped/muted, cropped to "cover" the page's
      // own viewport at a 16:9 aspect (matching a video zone in MiniDisplay,
      // whatever shape it's given). Exists only because YouTube's embed
      // player rejects file://-origin and localhost-origin parents outright,
      // regardless of Referer/origin header spoofing — it needs the actual
      // top-level navigation to be a real public https origin. No
      // analytics, no server, no state; this page reads nothing but the
      // query string and writes nothing anywhere.
      const VIDEO_ASPECT = 16 / 9
      const params = new URLSearchParams(location.search)
      const videoId = params.get('v')
      const valid = videoId && /^[\w-]{11}$/.test(videoId)

      if (!valid) {
        document.body.textContent = 'Missing or invalid ?v= video id'
        document.body.style.color = '#888'
        document.body.style.font = '14px sans-serif'
        document.body.style.padding = '16px'
      } else {
        const embed = new URLSearchParams({
          autoplay: '1',
          mute: '1',
          loop: '1',
          playlist: videoId,
          controls: '0',
          modestbranding: '1',
          rel: '0',
          iv_load_policy: '3',
          playsinline: '1',
          origin: location.origin
        })
        const iframe = document.createElement('iframe')
        iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}?${embed.toString()}`
        iframe.allow = 'autoplay; encrypted-media'
        document.body.appendChild(iframe)

        const resize = () => {
          const cw = window.innerWidth
          const ch = window.innerHeight
          if (cw === 0 || ch === 0) return
          const containerAspect = cw / ch
          if (containerAspect > VIDEO_ASPECT) {
            iframe.style.width = `${cw}px`
            iframe.style.height = `${cw / VIDEO_ASPECT}px`
          } else {
            iframe.style.width = `${ch * VIDEO_ASPECT}px`
            iframe.style.height = `${ch}px`
          }
        }
        // window.innerWidth/innerHeight can read 0 during this synchronous
        // initial script run, before the page's own layout has settled —
        // confirmed live: the first resize() call silently no-oped on its
        // cw===0/ch===0 guard, and since a webview's guest viewport is
        // already at its final size from creation, no later 'resize' event
        // ever fired to correct it, leaving the iframe at its unstyled
        // default size. Re-running on 'load' (and once more via rAF, for a
        // fully offscreen/headless window where even 'load' can beat
        // layout) covers that gap.
        resize()
        window.addEventListener('resize', resize)
        window.addEventListener('load', resize)
        requestAnimationFrame(resize)
      }
    </script>
  </body>
</html>
